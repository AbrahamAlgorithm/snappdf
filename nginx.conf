# a 404 page is the app's index.html, which points at this deploy's files. browsers must not keep it
map $status $cache_404 {
    404     "no-cache";
    default "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # reading the site, and posting a report, nothing else (nginx itself refuses POST to static files)
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm;

    # security headers, "always" so error pages get them too
    # (don't add add_header inside a location below, it would drop all of these for that location)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $cache_404 always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;

    # no dotfiles
    location ~ /\. {
        return 404;
    }

    # nginx doesn't know .mjs, and a pdf.js worker with the wrong type is refused by browsers
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        expires 1y;
    }

    # hashed build files never change, cache them for a year
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # always fetch a fresh index.html so new deploys show up
    location = /index.html {
        expires -1;
    }

    # same for the service worker, a cached one would keep serving the old version
    location = /sw.js {
        expires -1;
    }

    # nginx doesn't know .webmanifest either
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # bug reports go to the small report server running next to nginx (server/), it holds the email key
    location = /api/report {
        limit_except POST {
            deny all;
        }
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8081;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # the app's own pages (/, /app, /app/sign-pdf, /privacy, /report) are all the same single page app
    location ~ ^/(app(/[\w-]+)?|privacy|report)?/?$ {
        expires -1;
        try_files /index.html =404;
    }

    # anything else that isn't a real file gets a proper 404, with the app's not-found page as the body
    location / {
        try_files $uri =404;
        error_page 404 /index.html;
    }
}
