server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # it's a static site, nothing else is allowed
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/wasm;

    # security headers, "always" so error pages get them too
    # (don't add add_header inside a location below, it would drop all of these for that location)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;

    # no dotfiles
    location ~ /\. {
        return 404;
    }

    # nginx doesn't know .mjs, and a pdf.js worker with the wrong type is refused by browsers
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
        expires 1y;
    }

    # hashed build files never change, cache them for a year
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # always fetch a fresh index.html so new deploys show up
    location = /index.html {
        expires -1;
    }

    # every page route (/app, /app/sign-pdf...) is the same single page app
    location / {
        try_files $uri /index.html;
    }
}
