version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # keeps the pinned action commits in the workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
