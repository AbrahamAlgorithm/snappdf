name: Deploy

# every push to main goes live once the checks pass. pull requests never deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time, a newer push waits instead of cancelling one halfway
concurrency:
  group: deploy-production
  cancel-in-progress: false

# none of these are secrets. google only accepts logins from this repo's main branch
env:
  PROJECT_ID: my-portfolio-492519
  REGION: us-west1
  SERVICE: snappdf
  IMAGE: us-west1-docker.pkg.dev/my-portfolio-492519/snappdf/snappdf
  REPORT_IMAGE: us-west1-docker.pkg.dev/my-portfolio-492519/snappdf/snappdf-report
  WIF_PROVIDER: projects/179103012566/locations/global/workloadIdentityPools/snappdf-github/providers/github
  DEPLOYER: snappdf-deployer@my-portfolio-492519.iam.gserviceaccount.com

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy to Cloud Run
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # lets the job get a short-lived github token that google trusts, no stored keys
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}

      # the site (nginx) and the report sender (server/) are two images that run side by side
      - name: Build and push the images
        id: image
        run: |
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker build -t "$REPORT_IMAGE:$GITHUB_SHA" server
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$REPORT_IMAGE:$GITHUB_SHA"
          echo "ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "report=$(docker inspect --format='{{index .RepoDigests 0}}' "$REPORT_IMAGE:$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      # deploys by digest, so the exact images that were built are the ones that run.
      # nginx takes the traffic, the report sender sits next to it and only it gets the email secrets,
      # which live in secret manager (the repo only names them)
      - name: Deploy
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          REPORT_REF: ${{ steps.image.outputs.report }}
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --quiet \
            --container nginx-container \
            --image "$IMAGE_REF" \
            --port 8080 \
            --container report \
            --image "$REPORT_REF" \
            --cpu 1 \
            --memory 256Mi \
            --set-secrets RESEND_API_KEY=snappdf-resend-api-key:latest,REPORT_TO=snappdf-report-to:latest

      # tells bing, and the other search engines that share indexnow, that every page in the sitemap may have changed,
      # so they crawl it soon. the key is public on purpose, it's served at /1f6a05244dd6c440b4322ea6d22d0113.txt. a failure here never fails a deploy
      - name: Tell search engines about the new pages
        continue-on-error: true
        env:
          SITE: https://snappdf.abrahamalgorithm.tech
          INDEXNOW_KEY: 1f6a05244dd6c440b4322ea6d22d0113
        run: |
          urls=$(curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"${SITE#https://}\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"$SITE/$INDEXNOW_KEY.txt\",\"urlList\":$urls}"
